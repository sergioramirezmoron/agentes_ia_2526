<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo Frontend-Backend-Ollama</title>
    <script type="module" src="script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center"
  >
    <div
      class="bg-white shadow-xl rounded-xl p-10 w-full text-center max-w-md mb-6"
    >
      <h1 class="text-3xl font-bold text-blue-600 mb-6">
        🦙 Modelos IA disponibles by Sergio Ramírez
      </h1>
      <button
        id="btnModelos"
        class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 focus:outline-none font-semibold"
      >
        Ver Modelos
      </button>
      <p
        id="mostrarModelos"
        class="mt-6 text-xl font-medium text-gray-700 bg-gray-200 rounded p-4"
      >
        Aquí se mostrarán los modelos disponibles.
      </p>
    </div>
  </body>
</html>
